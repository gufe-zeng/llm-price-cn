name: Update model prices

on:
  schedule:
    # Near-real-time polling. GitHub Actions schedules run in UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest official pricing
        run: python scripts/update_prices.py --write
      - name: Commit changed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update model price data"
          file_pattern: data/prices.js
